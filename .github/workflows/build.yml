name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare and Locate Project
        id: prep
        run: |
          echo "=== Files in Repository ==="
          ls -la
          
          # If any zip exists, extract it
          if compgen -G "*.zip" > /dev/null; then
            for z in *.zip; do
              echo "Extracting: $z"
              unzip -o "$z"
            done
          fi

          # Find directory containing 'app' folder and settings file
          TARGET_DIR=$(find . -type d -name "app" -exec test -f "{}/build.gradle.kts" -o -f "{}/build.gradle" \; -printf "%h\n" | head -n 1)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "CRITICAL: Could not find 'app' folder anywhere in repo!"
            find . -maxdepth 3
            exit 1
          fi

          echo "TARGET_DIR is: $TARGET_DIR"
          echo "project_path=$TARGET_DIR" >> $GITHUB_OUTPUT
          
          # Create dummy .env file
          touch "$TARGET_DIR/.env"
          echo "GEMINI_API_KEY=dummy_key" >> "$TARGET_DIR/.env"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd "${{ steps.prep.outputs.project_path }}"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlanner-APK
          path: "**/build/outputs/apk/debug/*.apk"
