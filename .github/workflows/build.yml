name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Android Project
        id: prep
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          echo "=== Files in Repository ==="
          ls -la

          # The actual Android project is stored in project.zip.
          if [ -f "project.zip" ]; then
            echo "Extracting project.zip..."
            unzip -o "project.zip"
          fi

          if [ ! -f "settings.gradle.kts" ] || [ ! -d "app" ]; then
            echo "CRITICAL: Android project was not extracted correctly."
            find . -maxdepth 3 -print
            exit 1
          fi

          echo "=== Android Project ==="
          test -f "app/build.gradle.kts"
          test -f "settings.gradle.kts"

          # AI Studio adds a custom debug signingConfig that expects a local
          # debug.keystore. GitHub Actions does not have that local keystore.
          # Remove that override so the Android Gradle Plugin uses its normal
          # debug signing configuration and generates/uses the runner keystore.
          if grep -q 'signingConfig = signingConfigs.getByName("debugConfig")' app/build.gradle.kts; then
            echo "Removing AI Studio debugConfig signing override..."
            sed -i '/signingConfig = signingConfigs\.getByName("debugConfig")/d' app/build.gradle.kts
          fi

          # Android apps need INTERNET permission for Gemini/HTTP requests.
          # Add it automatically to the extracted project if it is missing.
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "CRITICAL: $MANIFEST not found."
            find app/src -maxdepth 5 -type f -print
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "Adding INTERNET permission..."
            python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          marker = 'android.permission.INTERNET'
          if marker not in s:
              pos = s.find('>')
              if pos == -1:
                  raise SystemExit("Invalid AndroidManifest.xml: no opening tag found")
              s = s[:pos+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + s[pos+1:]
              p.write_text(s, encoding="utf-8")
          PY
          fi

          # Gemini key is supplied as a GitHub Actions secret.
          # Never hard-code a real key into the repository.
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf '%s\n' "GEMINI_API_KEY=${GEMINI_API_KEY}" > .env
            echo "Gemini API key configured from GitHub Actions secret."
          else
            printf '%s\n' 'GEMINI_API_KEY=dummy_key' > .env
            echo "WARNING: GEMINI_API_KEY secret is not configured; APK will build but Gemini calls will not work."
          fi

          echo "project_path=." >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlanner-APK
          path: "app/build/outputs/apk/debug/*.apk"
