name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          # Find any zip file in repo and extract it
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_app
          
          # Find where settings.gradle or app directory is located
          ROOT_DIR=$(find extracted_app -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "project_root=$ROOT_DIR" >> $GITHUB_ENV
          echo "Project Root set to: $ROOT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd "${{ env.project_root }}"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlanner-APK
          path: "**/build/outputs/apk/debug/*.apk"
