name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Find Project Directory
        id: find-dir
        run: |
          APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Directory 'app' was not uploaded to GitHub!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$APP_DIR")
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ${{ steps.find-dir.outputs.project_root }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlanner-APK
          path: "**/build/outputs/apk/debug/*.apk"
